name: Feature request
description: Suggest a capability for people or AI agents.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: For agent-facing ideas, describe the tool you'd want (name, inputs, output).
