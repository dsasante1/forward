name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # repo-mode tests read git history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com

      # The published artifacts, not the source tree: pack forward-mcp and its
      # companion forward-capture as npm would, install them and drive their binaries.
      - name: Package smoke test
        run: |
          npm run pack -w apps/mcp
          npm run smoke:package -w apps/mcp

  # The built extension in a real VS Code: the webview bridge, the Problems panel
  # and file-driven refresh, none of which a unit test can reach.
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache VS Code
        uses: actions/cache@v4
        with:
          path: apps/extension/.vscode-test
          key: vscode-${{ runner.os }}-${{ hashFiles('apps/extension/e2e/run.mjs') }}

      - name: Extension end-to-end test
        run: xvfb-run -a npm run test:e2e -w apps/extension

      - name: Keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e
          path: apps/extension/e2e/out
          if-no-files-found: ignore

  # Dogfood the GitHub Action against a scratch project.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a scratch Forward project
        run: |
          mkdir -p "$RUNNER_TEMP/demo/.forward"
          printf '{\n  "format": 1,\n  "id": "demo",\n  "name": "Demo"\n}\n' > "$RUNNER_TEMP/demo/.forward/forward.json"
          # The digest step diffs inside the project's own repo, so make it one.
          cd "$RUNNER_TEMP/demo"
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "demo project"
      - uses: ./
        with:
          path: ${{ runner.temp }}/demo
          base: HEAD
          comment: false
          export: ${{ runner.temp }}/site
      - name: Check the export
        run: test -f "$RUNNER_TEMP/site/index.html" && test -f "$RUNNER_TEMP/site/forward.json"
