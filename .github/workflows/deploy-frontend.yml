name: Deploy frontend (Firebase Hosting)

on:
  push:
    branches: [master]
    paths:
      - "apps/dashboard/**"
      - "apps/canvas/**" # dashboard embeds the canvas as source
      - "packages/shared/**"
      - "firebase.hosting.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build shared contract
        run: npm run build -w packages/shared

      # VITE_* values are compiled INTO the bundle here — they are build-time, not
      # runtime. They are public (publishable keys / URLs only); no secrets.
      - name: Build dashboard
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build -w apps/dashboard

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APP_DEPLOYER_SA }}

      # firebase-tools honours GOOGLE_APPLICATION_CREDENTIALS for non-interactive
      # deploys, so it reuses the federated credentials from the auth step.
      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: >
          npx firebase-tools deploy
          --only hosting
          --config firebase.hosting.json
          --project ${{ vars.GCP_PROJECT_ID }}
          --non-interactive
