name: Deploy admin (Firebase Hosting)

on:
  push:
    branches: [master]
    paths:
      - "apps/admin/**"
      - "firebase.admin.json"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # VITE_* values are compiled INTO the bundle here — build-time, not runtime.
      # They are public (publishable key / URL only); no secrets.
      - name: Build admin
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build -w apps/admin

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APP_DEPLOYER_SA }}

      # firebase-tools honours GOOGLE_APPLICATION_CREDENTIALS for non-interactive
      # deploys, so it reuses the federated credentials from the auth step.
      # Retry: firebase-tools does its own WIF token exchange against
      # sts.googleapis.com via its bundled google-auth-library, which
      # intermittently fails with "Invalid response body ... Premature close"
      # (surfaced as the misleading "Failed to authenticate"). The exchange is
      # transient, so retry the idempotent deploy a few times before giving up.
      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::firebase deploy (attempt $attempt)"
            npx firebase-tools deploy \
              --only hosting \
              --config firebase.admin.json \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --non-interactive && { echo "::endgroup::"; exit 0; }
            echo "::endgroup::"
            echo "deploy attempt $attempt failed (transient STS token exchange?); retrying in 10s" >&2
            sleep 10
          done
          echo "all deploy attempts failed" >&2
          exit 1
