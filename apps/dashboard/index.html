<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Forward keeps design and API documentation in sync. Designers draw the interface on an open canvas; backend developers annotate it with live API docs from VS Code."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Forward — Design and API, in sync</title>
    <script>
      // Apply the saved colour theme before first paint to avoid a flash of
      // the light palette. Kept in sync afterwards by ThemeToggle.tsx.
      (() => {
        let t = "system";
        try {
          const saved = localStorage.getItem("forward-theme");
          if (saved === "light" || saved === "dark") t = saved;
        } catch {
          /* localStorage unavailable — fall back to system */
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
