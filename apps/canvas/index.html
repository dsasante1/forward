<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Design Connector — Canvas</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 13px/1.5 system-ui, sans-serif;
        background: #0f1115; color: #e6e6e6;
        display: grid; grid-template-columns: 56px 1fr 300px; height: 100vh;
      }

      /* --- toolbar --- */
      #toolbar {
        background: #14171f; border-right: 1px solid #262b36;
        display: flex; flex-direction: column; gap: 6px; padding: 8px 6px;
      }
      #toolbar button {
        width: 44px; height: 44px; border: 1px solid #262b36; border-radius: 8px;
        background: #1b2030; color: #cfd6e4; cursor: pointer; font-size: 11px;
      }
      #toolbar button.active { border-color: #5b8cff; color: #fff; background: #223; }
      #toolbar button:disabled { opacity: .4; cursor: default; }
      #toolbar .sep { height: 1px; background: #262b36; margin: 4px 0; }

      /* --- canvas --- */
      #stage { position: relative; overflow: hidden; }
      #canvas { width: 100%; height: 100%; display: block; background:
        radial-gradient(#1a1e28 1px, transparent 1px) 0 0 / 24px 24px; }
      .el-rect { fill: #1b2030; stroke: #3a4250; }
      .el-frame { fill: #161a24; stroke: #3a4250; stroke-dasharray: 4 3; }
      rect.el-selected { stroke: #5b8cff; stroke-width: 2; }
      rect.el-changed { stroke: #ffb020; stroke-width: 2; }
      rect.el-selected.el-changed { stroke: #5b8cff; }
      .el-label { fill: #e6e6e6; pointer-events: none; }
      .el-badge { fill: #5b8cff; font-size: 10px; font-weight: 700; pointer-events: none; }
      .handle { fill: #5b8cff; stroke: #0f1115; }
      .snapline { stroke: #ff5bd0; stroke-width: 1; }

      /* --- right panel: properties + API drawer --- */
      #panel { background: #14171f; border-left: 1px solid #262b36; overflow: auto; padding: 12px; }
      #panel h2 { margin: 0 0 4px; font-size: 15px; }
      #panel h3 { margin: 16px 0 4px; font-size: 12px; text-transform: uppercase; opacity: .6; }
      .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      .row label { width: 64px; opacity: .7; }
      .row input { flex: 1; background: #0c0e13; color: #e6e6e6;
        border: 1px solid #262b36; border-radius: 6px; padding: 4px 6px; }
      table { width: 100%; border-collapse: collapse; margin: 8px 0; }
      td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid #262b36; }
      .timeline { list-style: none; padding: 0; }
      .timeline li { margin-bottom: 8px; }
      code { background: #0c0e13; padding: 1px 5px; border-radius: 4px; }
      .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #243; }
      .empty { opacity: .5; }
    </style>
  </head>
  <body>
    <nav id="toolbar"></nav>
    <div id="stage"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <aside id="panel"><p class="empty">Select or draw an element.</p></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
