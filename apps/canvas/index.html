<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Design Connector — Canvas</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 13px/1.5 system-ui, sans-serif;
        background: #0f1115; color: #e6e6e6;
        display: grid; grid-template-columns: 56px 1fr 300px; height: 100vh;
      }

      /* --- toolbar --- */
      #toolbar {
        background: #14171f; border-right: 1px solid #262b36;
        display: flex; flex-direction: column; gap: 6px; padding: 8px 6px;
      }
      #toolbar button {
        width: 44px; height: 44px; border: 1px solid #262b36; border-radius: 8px;
        background: #1b2030; color: #cfd6e4; cursor: pointer; font-size: 11px;
      }
      #toolbar button.icon-btn {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px; line-height: 1;
      }
      #toolbar .icon-btn .tb-icon { width: 18px; height: 18px; }
      #toolbar .icon-btn span { font-size: 9.5px; }
      #toolbar button.active { border-color: #5b8cff; color: #fff; background: #223; }
      #toolbar button:disabled { opacity: .4; cursor: default; }
      #toolbar .sep { height: 1px; background: #262b36; margin: 4px 0; }

      /* --- canvas --- */
      #stage { position: relative; overflow: hidden; }
      #canvas {
        width: 100%; height: 100%; display: block; cursor: grab;
        background-color: #0a0a0a;
        background-image:
          linear-gradient(to right, rgba(255,255,255,0.08) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,0.08) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      #canvas.panning { cursor: grabbing; }

      /* --- zoom controls (overlay, bottom-left of stage) --- */
      #zoombar {
        position: absolute; left: 12px; bottom: 12px; z-index: 10;
        display: flex; align-items: center; gap: 4px; padding: 4px;
        background: #14171f; border: 1px solid #262b36; border-radius: 8px;
      }
      #zoombar button {
        min-width: 28px; height: 28px; border: 1px solid #262b36; border-radius: 6px;
        background: #1b2030; color: #cfd6e4; cursor: pointer; font-size: 13px;
      }
      #zoombar button:hover { border-color: #5b8cff; color: #fff; }
      #zoombar #zoomLabel {
        min-width: 48px; text-align: center; opacity: .8;
        font-variant-numeric: tabular-nums;
      }
      .el-rect { fill: #1b2030; stroke: #3a4250; }
      .el-frame { fill: #161a24; stroke: #3a4250; stroke-dasharray: 4 3; }
      rect.el-selected { stroke: #5b8cff; stroke-width: 2; }
      rect.el-changed { stroke: #ffb020; stroke-width: 2; }
      rect.el-selected.el-changed { stroke: #5b8cff; }
      .el-label { fill: #e6e6e6; pointer-events: none; }
      /* element name labels float on the black artboard, so keep them light */
      .el-name { fill: #cfd6e4; pointer-events: none; }
      .el-badge { fill: #5b8cff; font-size: 10px; font-weight: 700; pointer-events: none; }
      .handle { fill: #5b8cff; stroke: #0f1115; }
      .snapline { stroke: #ff5bd0; stroke-width: 1; }

      /* --- infrastructure overlay --- */
      .infra-box { fill: #1a1f2b; stroke-width: 1.5; }
      .infra-group { fill: rgba(127,127,127,0.06); stroke-dasharray: 5 4; }
      .infra-kind { fill: #8a93a3; font-size: 9px; font-weight: 700; letter-spacing: .6px; pointer-events: none; }
      .infra-label { fill: #e6e6e6; font-size: 13px; font-weight: 600; pointer-events: none; }
      .infra-tech { fill: #8a93a3; font-size: 11px; pointer-events: none; }
      .infra-edge { stroke: #5b8cff; stroke-width: 1.5; }
      .infra-edge-label { fill: #8a93a3; font-size: 10px; text-anchor: middle; pointer-events: none; }

      /* --- API doc leader line (anime.js-style callout) --- */
      .doc-leader { cursor: pointer; }
      .doc-leader-line { fill: none; stroke: #5b8cff; stroke-width: 1.5; }
      .doc-leader-dot { fill: #5b8cff; }
      .doc-leader-bg { fill: #14171f; stroke: #5b8cff; stroke-width: 1; }
      .doc-leader-label { fill: #e6e6e6; font-size: 12px; font-weight: 700; pointer-events: none; }
      .doc-leader-sub { fill: #8a93a3; font-size: 10px; pointer-events: none; }

      /* --- right panel: properties + API drawer --- */
      #panel { background: #14171f; border-left: 1px solid #262b36; overflow: auto; padding: 12px; }
      #panel h2 { margin: 0 0 4px; font-size: 15px; }
      #panel h3 { margin: 16px 0 4px; font-size: 12px; text-transform: uppercase; opacity: .6; }
      .panel-section { border-top: 1px solid #20242e; }
      .panel-section:first-of-type { border-top: none; }
      .panel-section > summary {
        cursor: pointer; user-select: none; list-style: none;
        display: flex; align-items: center; gap: 6px;
        margin: 0; padding: 12px 0 6px;
        font-size: 12px; text-transform: uppercase; letter-spacing: .4px; opacity: .6;
      }
      .panel-section > summary:hover { opacity: .9; }
      .panel-section > summary::-webkit-details-marker { display: none; }
      .panel-section > summary::before {
        content: "›"; display: inline-block; font-size: 13px; opacity: .8;
        transition: transform .15s;
      }
      .panel-section[open] > summary::before { transform: rotate(90deg); }
      .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      .row label { width: 64px; opacity: .7; }
      .row input, .row select, .row textarea { flex: 1; background: #0c0e13; color: #e6e6e6;
        border: 1px solid #262b36; border-radius: 6px; padding: 4px 6px; font: inherit; }
      .row textarea { resize: vertical; min-height: 56px; }
      .row-stack { flex-direction: column; align-items: stretch; }
      .row-stack label { width: auto; }
      .doc-add, .doc-remove {
        margin-top: 8px; width: 100%; padding: 6px 8px; border-radius: 6px;
        background: #1b2030; color: #cfd6e4; border: 1px solid #262b36; cursor: pointer;
      }
      .doc-add:hover { border-color: #5b8cff; color: #fff; }
      .doc-remove { background: transparent; color: #d1603d; border-color: #3a2a2a; }
      .doc-remove:hover { border-color: #d1603d; }
      .doc-optional { margin-top: 8px; border-top: 1px solid #20242e; padding-top: 6px; }
      .doc-optional > summary {
        cursor: pointer; list-style: revert; font-size: 11px; letter-spacing: .4px;
        text-transform: uppercase; opacity: .55; padding: 4px 0; user-select: none;
      }
      .doc-optional > summary:hover { opacity: .85; }
      .doc-optional[open] > summary { margin-bottom: 4px; }
      table { width: 100%; border-collapse: collapse; margin: 8px 0; }
      td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid #262b36; }
      .timeline { list-style: none; padding: 0; }
      .timeline li { margin-bottom: 8px; }
      code { background: #0c0e13; padding: 1px 5px; border-radius: 4px; }
      .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #243; }
      .empty { opacity: .5; }

      /* --- endpoint timeline panel (overlay, right of stage) --- */
      #history {
        position: absolute; top: 12px; right: 12px; bottom: 12px; width: 420px; z-index: 20;
        background: #11141b; border: 1px solid #232938; border-radius: 12px;
        overflow: auto; padding: 0;
        --tl-created: #36c275; --tl-modified: #5b8cff; --tl-deleted: #e0507a;
        box-shadow: 0 18px 50px rgba(0,0,0,.45);
      }
      #history[hidden] { display: none; }
      #history h3 {
        margin: 0 0 8px; font-size: 11px; letter-spacing: .6px;
        text-transform: uppercase; opacity: .55;
      }
      .tl-head {
        position: sticky; top: 0; z-index: 2;
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 16px; background: #11141b; border-bottom: 1px solid #1e2433;
      }
      .tl-head h2 { margin: 0; font-size: 16px; font-weight: 650; }
      .tl-head-actions { display: flex; gap: 4px; }
      .tl-collapse, .tl-close {
        border: none; background: transparent; color: #8a93a3;
        font-size: 15px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 7px;
      }
      .tl-collapse:hover, .tl-close:hover { color: #fff; background: #1b2233; }
      .tl-body { padding: 14px 16px 18px; }
      .tl-body[hidden] { display: none; }

      /* Digest */
      .tl-since { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
      .tl-since label { opacity: .6; font-size: 12px; }
      .tl-since select {
        flex: 1; background: #161b26; color: #e6e6e6;
        border: 1px solid #283044; border-radius: 8px; padding: 8px 10px; font: inherit;
      }
      .tl-digest-card {
        background: #161b26; border: 1px solid #232b3c; border-radius: 10px;
        padding: 12px; margin-bottom: 4px;
      }
      .tl-pills { display: flex; gap: 8px; flex-wrap: wrap; }
      .tl-pill {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 12px; border-radius: 99px; font-size: 12px;
        background: #1c2434; border: 1px solid #2a3447;
      }
      .tl-pill-zero { opacity: .45; }
      .tl-pill .tl-dot { width: 7px; height: 7px; border-radius: 50%; }
      .tl-pill-created .tl-dot { background: var(--tl-created); }
      .tl-pill-modified .tl-dot { background: var(--tl-modified); }
      .tl-pill-deleted .tl-dot { background: var(--tl-deleted); }
      .tl-pill-n { font-weight: 700; }
      .tl-pill-created .tl-pill-n { color: var(--tl-created); }
      .tl-pill-modified .tl-pill-n { color: var(--tl-modified); }
      .tl-pill-deleted .tl-pill-n { color: var(--tl-deleted); }
      .tl-netchange { margin-top: 12px; font-size: 12px; opacity: .8; }
      .tl-netchange.empty { margin-top: 10px; }
      .tl-net-strong { color: var(--tl-created); font-weight: 700; }

      /* History header + tabs */
      .tl-history-head {
        display: flex; align-items: center; justify-content: space-between;
        margin: 22px 0 10px;
      }
      .tl-history-head h3 { margin: 0; }
      .tl-tabs { display: flex; gap: 4px; }
      .tl-tab {
        border: none; background: transparent; color: #8a93a3;
        font: inherit; font-size: 11px; cursor: pointer;
        padding: 4px 10px; border-radius: 99px;
      }
      .tl-tab:hover { color: #cfd6e4; }
      .tl-tab.active { background: #232c40; color: #fff; }

      /* History feed: single rail + ring nodes */
      .tl-graph { display: flex; flex-direction: column; }
      .tl-empty { padding: 12px 4px; font-size: 12px; }
      .tl-row { display: flex; gap: 12px; }
      .tl-rail { position: relative; flex: none; width: 18px; }
      .tl-rail::before {
        content: ""; position: absolute; left: 8px; top: 0; bottom: 0;
        width: 2px; background: #2a3242;
      }
      .tl-row:first-child .tl-rail::before { top: 22px; }
      .tl-row:last-child .tl-rail::before { bottom: auto; height: 22px; }
      .tl-node {
        position: absolute; left: 1px; top: 14px; width: 16px; height: 16px;
        background: #11141b; border-radius: 50%;
      }
      .tl-node-ring { fill: none; stroke-width: 2; }
      .tl-row-created .tl-node-ring { stroke: var(--tl-created); }
      .tl-row-modified .tl-node-ring { stroke: var(--tl-modified); }
      .tl-row-deleted .tl-node-ring { stroke: var(--tl-deleted); }
      .tl-row-created .tl-node-core { fill: var(--tl-created); }
      .tl-row-modified .tl-node-core { fill: var(--tl-modified); }
      .tl-row-deleted .tl-node-core { fill: var(--tl-deleted); }

      .tl-card {
        flex: 1; min-width: 0; margin-bottom: 10px; cursor: pointer;
        background: #141926; border: 1px solid #212a3b; border-radius: 10px;
        padding: 12px 12px 10px;
      }
      .tl-card:hover { border-color: #2e3a52; }
      .tl-card.open { background: #151b2a; }
      .tl-card-head { display: flex; align-items: center; gap: 8px; }
      .tl-card-head-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
      .tl-action { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
      .tl-action-created { color: var(--tl-created); }
      .tl-action-modified { color: var(--tl-modified); }
      .tl-action-deleted { color: var(--tl-deleted); }
      .tl-method {
        font-size: 10px; font-weight: 700; letter-spacing: .3px;
        padding: 2px 6px; border-radius: 5px; background: #1d2433; color: #9fb2d8;
      }
      .tl-method-GET { color: #36c275; }
      .tl-method-POST { color: #5b8cff; }
      .tl-method-PUT, .tl-method-PATCH { color: #e0a23c; }
      .tl-method-DELETE { color: #e0507a; }
      .tl-title { font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tl-stat { display: inline-flex; gap: 5px; font-size: 11px; font-weight: 700; font-family: ui-monospace, monospace; }
      .tl-stat-add { color: var(--tl-created); }
      .tl-stat-del { color: var(--tl-deleted); }
      .tl-mag { display: inline-flex; gap: 2px; }
      .tl-mag-cell { width: 5px; height: 12px; border-radius: 2px; background: #2a3242; }
      .tl-mag-created .tl-mag-cell { background: var(--tl-created); opacity: .5; }
      .tl-mag-modified .tl-mag-cell { background: var(--tl-modified); opacity: .5; }
      .tl-mag-deleted .tl-mag-cell { background: var(--tl-deleted); opacity: .5; }
      .tl-chevron { color: #8a93a3; font-size: 12px; transition: transform .15s; }
      .tl-card.open .tl-chevron { transform: rotate(180deg); }

      .tl-version {
        font-family: ui-monospace, monospace; font-size: 11px; margin-top: 8px;
        display: inline-block; padding: 2px 8px; border-radius: 6px; background: #10141f;
        border: 1px solid #212a3b;
      }
      .tl-ver-old { opacity: .55; }
      .tl-ver-arrow { opacity: .55; }
      .tl-ver-new { color: #cfd6e4; font-weight: 600; }
      .tl-path { font-family: ui-monospace, monospace; font-size: 12px; opacity: .8; margin-top: 8px; }
      .tl-log { font-size: 12px; opacity: .8; margin-top: 6px; line-height: 1.45; }
      .tl-author { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
      .tl-avatar {
        width: 18px; height: 18px; border-radius: 50%; flex: none;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 10px; font-weight: 700; color: #fff; background: #3a4a6a;
      }
      .tl-author-parts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; opacity: .6; }
      .tl-author-name { font-weight: 600; opacity: .85; }
      .tl-commit { font-family: ui-monospace, monospace; }

      /* Expanded diff */
      .tl-detail { margin-top: 12px; border-top: 1px solid #212a3b; padding-top: 12px; }
      .tl-detail[hidden] { display: none; }
      .tl-detail-note { font-size: 12px; opacity: .8; line-height: 1.45; }
      .tl-diff-section { margin-bottom: 12px; }
      .tl-diff-label { font-family: ui-monospace, monospace; font-size: 11px; opacity: .55; margin-bottom: 4px; }
      .tl-diff-table {
        border: 1px solid #212a3b; border-radius: 8px; overflow: hidden;
        font-family: ui-monospace, monospace; font-size: 11.5px;
      }
      .tl-diff-row {
        position: relative; display: grid; grid-template-columns: 92px 64px 1fr;
        gap: 8px; padding: 6px 10px 6px 22px; border-bottom: 1px solid #1a2130;
      }
      .tl-diff-row:last-child { border-bottom: none; }
      .tl-diff-row::before {
        position: absolute; left: 8px; top: 6px; font-weight: 700;
      }
      .tl-diff-added { background: rgba(54,194,117,.1); }
      .tl-diff-added::before { content: "+"; color: var(--tl-created); }
      .tl-diff-removed { background: rgba(224,80,122,.1); }
      .tl-diff-removed::before { content: "−"; color: var(--tl-deleted); }
      .tl-diff-removed .tl-diff-cell { text-decoration: line-through; opacity: .65; }
      .tl-diff-cell { min-width: 0; overflow-wrap: anywhere; }
      .tl-diff-cell:first-child { font-weight: 600; }

      .tl-breaking {
        display: flex; gap: 10px; align-items: flex-start; margin: 12px 0;
        padding: 10px 12px; border-radius: 9px;
        background: #1f1a14; border: 1px solid #3a2e1a;
      }
      .tl-breaking-icon { color: #e0a23c; font-size: 14px; line-height: 1.3; }
      .tl-breaking-text { font-size: 12px; line-height: 1.45; color: #e7d6b8; }

      .tl-detail-actions { display: flex; gap: 8px; margin-top: 4px; }
      .tl-btn {
        font: inherit; font-size: 11px; cursor: pointer; color: #cfd6e4;
        background: #161d2b; border: 1px solid #283044; border-radius: 7px; padding: 6px 11px;
      }
      .tl-btn:hover { border-color: #3a4660; background: #1b2333; }

      .access-error {
        position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
        padding: 10px 16px; font-size: 13px; text-align: center;
        background: #3a1d1d; color: #ffb4b4; border-bottom: 1px solid #7a2e2e;
      }
    </style>
  </head>
  <body>
    <nav id="toolbar"></nav>
    <div id="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="zoombar">
        <button id="zoomOut" title="Zoom out">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" title="Zoom in">+</button>
        <button id="zoomFit" title="Fit to content">Fit</button>
      </div>
      <div id="history" hidden></div>
    </div>
    <aside id="panel"><p class="empty">Select or draw an element.</p></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
