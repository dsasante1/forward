<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Design Connector — Canvas</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 13px/1.5 system-ui, sans-serif;
        background: #0f1115; color: #e6e6e6;
        display: grid; grid-template-columns: 56px 1fr 300px; height: 100vh;
      }

      /* --- toolbar --- */
      #toolbar {
        background: #14171f; border-right: 1px solid #262b36;
        display: flex; flex-direction: column; gap: 6px; padding: 8px 6px;
      }
      #toolbar button {
        width: 44px; height: 44px; border: 1px solid #262b36; border-radius: 8px;
        background: #1b2030; color: #cfd6e4; cursor: pointer; font-size: 11px;
      }
      #toolbar button.active { border-color: #5b8cff; color: #fff; background: #223; }
      #toolbar button:disabled { opacity: .4; cursor: default; }
      #toolbar .sep { height: 1px; background: #262b36; margin: 4px 0; }

      /* --- canvas --- */
      #stage { position: relative; overflow: hidden; }
      #canvas {
        width: 100%; height: 100%; display: block; cursor: grab;
        background-color: #0a0a0a;
        background-image:
          linear-gradient(to right, rgba(255,255,255,0.08) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,0.08) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      #canvas.panning { cursor: grabbing; }

      /* --- zoom controls (overlay, bottom-left of stage) --- */
      #zoombar {
        position: absolute; left: 12px; bottom: 12px; z-index: 10;
        display: flex; align-items: center; gap: 4px; padding: 4px;
        background: #14171f; border: 1px solid #262b36; border-radius: 8px;
      }
      #zoombar button {
        min-width: 28px; height: 28px; border: 1px solid #262b36; border-radius: 6px;
        background: #1b2030; color: #cfd6e4; cursor: pointer; font-size: 13px;
      }
      #zoombar button:hover { border-color: #5b8cff; color: #fff; }
      #zoombar #zoomLabel {
        min-width: 48px; text-align: center; opacity: .8;
        font-variant-numeric: tabular-nums;
      }
      .el-rect { fill: #1b2030; stroke: #3a4250; }
      .el-frame { fill: #161a24; stroke: #3a4250; stroke-dasharray: 4 3; }
      rect.el-selected { stroke: #5b8cff; stroke-width: 2; }
      rect.el-changed { stroke: #ffb020; stroke-width: 2; }
      rect.el-selected.el-changed { stroke: #5b8cff; }
      .el-label { fill: #e6e6e6; pointer-events: none; }
      /* element name labels float on the black artboard, so keep them light */
      .el-name { fill: #cfd6e4; pointer-events: none; }
      .el-badge { fill: #5b8cff; font-size: 10px; font-weight: 700; pointer-events: none; }
      .handle { fill: #5b8cff; stroke: #0f1115; }
      .snapline { stroke: #ff5bd0; stroke-width: 1; }

      /* --- infrastructure overlay --- */
      .infra-box { fill: #1a1f2b; stroke-width: 1.5; }
      .infra-group { fill: rgba(127,127,127,0.06); stroke-dasharray: 5 4; }
      .infra-kind { fill: #8a93a3; font-size: 9px; font-weight: 700; letter-spacing: .6px; pointer-events: none; }
      .infra-label { fill: #e6e6e6; font-size: 13px; font-weight: 600; pointer-events: none; }
      .infra-tech { fill: #8a93a3; font-size: 11px; pointer-events: none; }
      .infra-edge { stroke: #5b8cff; stroke-width: 1.5; }
      .infra-edge-label { fill: #8a93a3; font-size: 10px; text-anchor: middle; pointer-events: none; }

      /* --- API doc leader line (anime.js-style callout) --- */
      .doc-leader { cursor: pointer; }
      .doc-leader-line { fill: none; stroke: #5b8cff; stroke-width: 1.5; }
      .doc-leader-dot { fill: #5b8cff; }
      .doc-leader-bg { fill: #14171f; stroke: #5b8cff; stroke-width: 1; }
      .doc-leader-label { fill: #e6e6e6; font-size: 12px; font-weight: 700; pointer-events: none; }
      .doc-leader-sub { fill: #8a93a3; font-size: 10px; pointer-events: none; }

      /* --- right panel: properties + API drawer --- */
      #panel { background: #14171f; border-left: 1px solid #262b36; overflow: auto; padding: 12px; }
      #panel h2 { margin: 0 0 4px; font-size: 15px; }
      #panel h3 { margin: 16px 0 4px; font-size: 12px; text-transform: uppercase; opacity: .6; }
      .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      .row label { width: 64px; opacity: .7; }
      .row input, .row select, .row textarea { flex: 1; background: #0c0e13; color: #e6e6e6;
        border: 1px solid #262b36; border-radius: 6px; padding: 4px 6px; font: inherit; }
      .row textarea { resize: vertical; min-height: 56px; }
      .row-stack { flex-direction: column; align-items: stretch; }
      .row-stack label { width: auto; }
      .doc-add, .doc-remove {
        margin-top: 8px; width: 100%; padding: 6px 8px; border-radius: 6px;
        background: #1b2030; color: #cfd6e4; border: 1px solid #262b36; cursor: pointer;
      }
      .doc-add:hover { border-color: #5b8cff; color: #fff; }
      .doc-remove { background: transparent; color: #d1603d; border-color: #3a2a2a; }
      .doc-remove:hover { border-color: #d1603d; }
      table { width: 100%; border-collapse: collapse; margin: 8px 0; }
      td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid #262b36; }
      .timeline { list-style: none; padding: 0; }
      .timeline li { margin-bottom: 8px; }
      code { background: #0c0e13; padding: 1px 5px; border-radius: 4px; }
      .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #243; }
      .empty { opacity: .5; }

      /* --- endpoint timeline panel (overlay, right of stage) --- */
      #history {
        position: absolute; top: 12px; right: 12px; bottom: 12px; width: 380px; z-index: 20;
        background: #14171f; border: 1px solid #262b36; border-radius: 10px;
        overflow: auto; padding: 12px 14px;
      }
      #history[hidden] { display: none; }
      #history h3 { margin: 16px 0 6px; font-size: 11px; text-transform: uppercase; opacity: .6; }
      .tl-head { display: flex; align-items: center; justify-content: space-between; }
      .tl-head h2 { margin: 0; font-size: 15px; }
      .tl-close {
        border: none; background: transparent; color: #8a93a3;
        font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 6px;
      }
      .tl-close:hover { color: #fff; background: #1b2030; }
      .tl-since { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
      .tl-since label { opacity: .7; }
      .tl-since select {
        flex: 1; background: #0c0e13; color: #e6e6e6;
        border: 1px solid #262b36; border-radius: 6px; padding: 4px 6px; font: inherit;
      }
      .tl-group-title {
        display: flex; gap: 8px; align-items: center;
        font-size: 12px; font-weight: 600; margin: 10px 0 2px;
      }
      .tl-count { font-size: 10px; padding: 1px 7px; border-radius: 99px; background: #243; color: #cfd6e4; }
      .tl-item {
        display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap;
        padding: 4px 6px; border-radius: 6px; cursor: pointer;
      }
      .tl-item:hover { background: #1b2030; }
      .tl-method { font-size: 10px; font-weight: 700; color: #5b8cff; }
      .tl-title { font-size: 12px; font-weight: 600; }
      .tl-path { font-family: ui-monospace, monospace; font-size: 11px; opacity: .75; }
      .tl-graph { display: flex; flex-direction: column; }
      .tl-row { display: flex; gap: 10px; cursor: pointer; border-radius: 6px; padding: 0 4px; }
      .tl-row:hover { background: #1b2030; }
      .tl-rail { flex: none; display: block; }
      .tl-rail line { stroke: #3a4250; stroke-width: 2; }
      .tl-node-created { fill: #36c275; }
      .tl-node-modified { fill: #5b8cff; }
      .tl-node-deleted { fill: #e0507a; }
      .tl-info { min-width: 0; padding: 5px 0; }
      .tl-info > div > * + * { margin-left: 6px; }
      .tl-action { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
      .tl-action-created { color: #36c275; }
      .tl-action-modified { color: #5b8cff; }
      .tl-action-deleted { color: #e0507a; }
      .tl-log { font-size: 11px; opacity: .8; }
      .tl-meta { font-size: 10px; opacity: .55; }

      .access-error {
        position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
        padding: 10px 16px; font-size: 13px; text-align: center;
        background: #3a1d1d; color: #ffb4b4; border-bottom: 1px solid #7a2e2e;
      }
    </style>
  </head>
  <body>
    <nav id="toolbar"></nav>
    <div id="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="zoombar">
        <button id="zoomOut" title="Zoom out">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" title="Zoom in">+</button>
        <button id="zoomFit" title="Fit to content">Fit</button>
      </div>
      <div id="history" hidden></div>
    </div>
    <aside id="panel"><p class="empty">Select or draw an element.</p></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
