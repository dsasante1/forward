# Forward docs (repo mode) — your AI documents every pull request, in the PR.
#
# Copy this file into YOUR repository at .github/workflows/forward-docs.yml.
# The project lives in .forward/ (create it with `npx -y -p forward-mcp forward init`),
# so there is no Forward server and no Forward token: on each pull request your
# own AI reads the diff + FORWARD_DOCS.md and writes forward-docs.json, the
# deterministic `forward-docs apply` step turns that into .forward/ file changes,
# and they are committed back to the PR branch — reviewed and merged with the code.
#
# Prerequisites (one-time):
#   1. Copy FORWARD_DOCS.md into your repo; your AI step reads it as its prompt.
#   2. Add the secret your AI needs (e.g. ANTHROPIC_API_KEY / OPENAI_API_KEY).
#   3. Keep `@adc <id>` anchors next to the endpoints you want documented.
#
# Fork PRs get no secrets, so the AI step can't run for them; the job skips them.
# Commits pushed with GITHUB_TOKEN don't trigger new workflow runs, so this can't loop.

name: Forward docs

on:
  pull_request:

permissions:
  contents: write

jobs:
  forward-docs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: forward-docs-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # ── STEP 1: YOUR AI (bring your own). ───────────────────────────────────
      # Its ONLY job: read FORWARD_DOCS.md and the diff between the two refs
      # below, then write forward-docs.json to the repo root. Example:
      #
      #   - run: npm i -g @anthropic-ai/claude-code
      #   - run: claude -p "$(cat FORWARD_DOCS.md)" --allowedTools "Bash,Read,Write"
      #     env:
      #       ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #       FORWARD_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
      #       FORWARD_DIFF_HEAD: ${{ github.event.pull_request.head.sha }}
      #
      # An agent with the forward MCP server connected can instead edit .forward/
      # directly through its tools; then skip STEP 2 and just commit.
      #
      # Security: the agent reads the PR's own content, so treat that as untrusted
      # input (prompt injection). This job holds `contents: write` and your AI key.
      # Grant the narrowest tools that work (prefer Read/Write over Bash), and only
      # run it for PRs from people you trust; fork PRs are already skipped above.
      - name: Generate forward-docs.json with your AI
        run: 'echo "TODO: run your agent here to write forward-docs.json"'
        env:
          FORWARD_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          FORWARD_DIFF_HEAD: ${{ github.event.pull_request.head.sha }}

      # ── STEP 2: the deterministic write into .forward/ (no AI, no token). ───
      - name: Apply to .forward/
        if: hashFiles('forward-docs.json') != ''
        uses: dsasante1/forward/apps/docs-ci@docs-ci-v2
        with:
          commit: ${{ github.event.pull_request.head.sha }}
          commit-message: ${{ github.event.pull_request.title }}

      - name: Commit the documentation to the PR
        if: hashFiles('forward-docs.json') != ''
        run: |
          rm -f forward-docs.json
          git add .forward
          if git diff --cached --quiet; then
            echo "Documentation already up to date."
            exit 0
          fi
          git -c user.name="forward-docs[bot]" -c user.email="forward-docs@users.noreply.github.com" \
            commit -m "docs(forward): document ${{ github.event.pull_request.head.sha }}"
          git push
