# Forward docs — generate on every change that lands on the default branch.
#
# Copy this file into YOUR repository at .github/workflows/forward-docs.yml.
# On each push to the default branch (a merged PR — fork or not — and direct
# pushes both produce one), it hands your own AI the diff + the Forward
# instructions to produce forward-docs.json, then runs the deterministic
# `forward-docs apply` step to write it to your project.
#
# Why `push` and not `pull_request`: a `pull_request` run from a FORK gets no
# repository secrets, so FORWARD_API_TOKEN would be empty and the write would
# fail. A push to the default branch always runs in your repo with secrets.
#
# Prerequisites (one-time):
#   1. In the Forward dashboard, mint a project API token and add it as the repo
#      secret FORWARD_API_TOKEN.
#   2. Set FORWARD_API_BASE_URL and FORWARD_PROJECT_ID below (or as repo vars).
#   3. Add the secret your AI needs (e.g. ANTHROPIC_API_KEY / OPENAI_API_KEY).
#   4. Keep `@adc <id>` anchors next to the endpoints you want documented
#      (the Forward VS Code extension writes these for you).

name: Forward docs

on:
  push:
  workflow_dispatch:

jobs:
  forward-docs:
    # Default branch only — whatever it's named (main/master/…). Non-default
    # branch pushes and tag pushes fall through this guard and are skipped.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    concurrency:
      group: forward-docs-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history so the diff base exists locally

      # The change range — passed to your AI as FORWARD_DIFF_BASE / _HEAD.
      - id: range
        run: |
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          # First push to a branch (all-zero base) or a force-push (base not an
          # ancestor) leaves no usable base — fall back to the head's first parent
          # so the diff is still bounded to this change.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${head}~1" 2>/dev/null || echo "${head}")"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "head=${head}" >> "$GITHUB_OUTPUT"

      # ── STEP 1: YOUR AI (bring your own). ───────────────────────────────────
      # Replace this block with however you run your agent. Its ONLY job is to
      # read FORWARD_DOCS.md (the instructions) and the diff, then write
      # forward-docs.json to the repo root. It never needs the Forward token.
      #
      # Example with Claude Code (swap for any agent / provider you use):
      #
      #   - run: npm i -g @anthropic-ai/claude-code
      #   - run: |
      #       claude -p "$(cat FORWARD_DOCS.md)" \
      #         --allowedTools "Bash,Read,Write"
      #     env:
      #       ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #       FORWARD_DIFF_BASE: ${{ steps.range.outputs.base }}
      #       FORWARD_DIFF_HEAD: ${{ steps.range.outputs.head }}
      - name: Generate forward-docs.json with your AI
        run: echo "TODO: run your agent here to write forward-docs.json"
        env:
          FORWARD_DIFF_BASE: ${{ steps.range.outputs.base }}
          FORWARD_DIFF_HEAD: ${{ steps.range.outputs.head }}

      # Surface a broken AI step: an empty diff legitimately produces no file, but
      # so does an agent that errored yet exited 0 — warn (don't fail) so the
      # no-op is visible in the run instead of silently green.
      - name: Note when no plan was produced
        if: hashFiles('forward-docs.json') == ''
        run: echo "::warning::No forward-docs.json was produced — skipping the Forward update. If this change touched documented code, check the AI step above."

      # ── STEP 2: the deterministic write (Forward-provided, no AI). ──────────
      # A bundled composite action — nothing to install, no npm registry.
      # Pin @docs-ci-v1 to a tag/sha you trust.
      - name: Apply to Forward
        if: hashFiles('forward-docs.json') != ''
        uses: dsasante1/forward/apps/docs-ci@docs-ci-v1
        with:
          api-base-url: https://api.forward.dev # ← your Forward backend
          project-id: project_xxx # ← your Forward project id
          api-token: ${{ secrets.FORWARD_API_TOKEN }}
          commit: ${{ github.sha }}
          commit-message: ${{ github.event.head_commit.message }}

      # Keep the rollback snapshot (prior ER + Agents/MCP state) recoverable —
      # the server checkpoint only covers design + infra. Re-apply it with
      # `forward-docs apply forward-docs.rollback.json` to revert those layers.
      - name: Upload rollback snapshot
        if: always() && hashFiles('forward-docs.rollback.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: forward-docs-rollback
          path: forward-docs.rollback.json
          retention-days: 30
