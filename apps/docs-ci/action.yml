name: "Forward docs apply"
description: "Validate an AI-produced forward-docs.json and write it to a Forward project (checkpoint-safe, idempotent). No AI runs here — this is the deterministic write step."
author: "Forward"
branding:
  icon: "upload-cloud"
  color: "purple"

inputs:
  plan:
    description: "Path to the forward-docs.json your AI produced."
    required: false
    default: "forward-docs.json"
  api-base-url:
    description: "Forward backend base URL, e.g. https://api.forward.dev"
    required: true
  project-id:
    description: "Target Forward project (tenancy) id."
    required: true
  api-token:
    description: "Forward project API token (pass a secret)."
    required: true
  commit:
    description: "Commit sha, used as the default version label on bindings."
    required: false
    default: ""
  commit-message:
    description: "Commit message, used as the default change log on bindings."
    required: false
    default: ""

# Composite = a self-contained copy that runs from a single pre-bundled file.
# GitHub checks this action out at the referenced ref; $GITHUB_ACTION_PATH points
# at it. Node is preinstalled on runners, so there is no install/registry step.
runs:
  using: "composite"
  steps:
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/dist/action.mjs" apply "${{ inputs.plan }}"
      env:
        FORWARD_API_BASE_URL: ${{ inputs.api-base-url }}
        FORWARD_PROJECT_ID: ${{ inputs.project-id }}
        FORWARD_API_TOKEN: ${{ inputs.api-token }}
        FORWARD_COMMIT: ${{ inputs.commit }}
        FORWARD_COMMIT_MESSAGE: ${{ inputs.commit-message }}
